plugins { id 'com.android.application' }

// Local-only credentials; do not substitute a different paired signing identity.
def signingPasswords = new Properties()
def passwordsFile = rootProject.file('../signing/passwords.properties')
if (passwordsFile.isFile()) passwordsFile.withInputStream { signingPasswords.load(it) }
def pairedPassword = System.getenv('WRIST_SIGNING_PASSWORD') ?: signingPasswords.getProperty('password')
if (!project.hasProperty('unsigned') && !pairedPassword) {
    throw new GradleException('Restore signing/passwords.properties or set WRIST_SIGNING_PASSWORD; use -Punsigned for compile-only checks.')
}

android {
    namespace 'io.github.mi9pro.navigation'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.mi9pro.navigation'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.3.2'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        sharedDebug {
            storeFile rootProject.file('../signing/development.p12')
            storePassword pairedPassword
            keyAlias 'wrist-navigation'
            keyPassword pairedPassword
            storeType 'PKCS12'
        }
    }
    buildTypes {
        // Explicit compile-only path for a fresh checkout without the private identity.
        // Never substitute a generated debug certificate for the paired devices.
        debug { signingConfig project.hasProperty('unsigned') ? null : signingConfigs.sharedDebug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/xms-wearable-lib_1.4_release.aar')
    implementation 'androidx.annotation:annotation:1.8.2'
    testImplementation 'junit:junit:4.13.2'
}
